iv><p id="details" class="note"></p><small><span data-i18n="Tap: next · Double: photos / disk groups · Triple: mode · Five: management · Six: Wi-Fi">单击翻页 · 双击照片 / 更多硬盘与卷 · 三击切换功能 · 五击管理 · 六击配网</span></small></section><form id="settings" class="hidden" method="post" action="/save"><input type="hidden" name="token" value="{{token}}"><input type="hidden" name="alarmDays" value="127"><section><h2><span data-i18n="Desktop &amp; display">桌面与显示</span></h2><div class="fields"><label><span data-i18n="Display language">小电视语言</span><select name="language"><option value="zh">中文</option><option value="en">English</option></select></label><label><span data-i18n="Start page">启动页面</span><select name="home"><option value="6" data-i18n="Clock">大字时钟</option><option value="5" data-i18n="Weather">天气</option><option value="7" data-i18n="Photos">相册</option><option value="0" data-i18n="NAS overview">NAS 总览</option><option value="1" data-i18n="Network">网络</option><option value="2" data-i18n="CPU / memory">CPU / 内存</option><option value="8" data-i18n="Disk health">硬盘健康</option><option value="9" data-i18n="Volumes">存储卷</option><option value="4" data-i18n="Status">设备状态</option></select></label><label><span data-i18n="Hour color">时的颜色</span><input name="clockColor" type="color" ><button type="button" class="secondary" onclick="resetColors('clock')" data-i18n="Default clock colors">恢复时钟默认颜色</button></label><label><span data-i18n="Minute color">分的颜色</span><input name="minuteColor" type="color"></label><label><span data-i18n="Show seconds">秒数显示</span><select name="showSeconds"><option value="1" data-i18n="On">开启</option><option value="0" data-i18n="Off">关闭</option></select></label><label><span data-i18n="Brightness / %">亮度 / %</span><input name="brightness" type="number" min="5" max="100"></label><label><span data-i18n="Orientation">方向</span><select name="rotation"><option value="0" data-i18n="0°">0°</option><option value="1" data-i18n="90°">90°</option><option value="2" data-i18n="180°">180°</opt </label><label><span data-i18n="Time">时间</span><input name="alarmTime" type="time" required></label><label class="wide"><span data-i18n="Repeat">重复</span></label><div class="days"><label><input type="checkbox" class="day" value="1"><span data-i18n="Mon">一</span></label><label><input type="checkbox" class="day" value="2"><span data-i18n="Tue">二</span></label><label><input type="checkbox" class="day" value="4"><span data-i18n="Wed">三</span></label><label><input type="checkbox" class="day" value="8"><span data-i18n="Thu">四</span></label><label><input type="checkbox" class="day" value="16"><span data-i18n="Fri">五</span></label><label><input type="checkbox" class="day" value="32"><span data-i18n="Sat">六</span></label><label><input type="checkbox" class="day" value="64"><span data-i18n="Sun">日</span></label></div><label><span data-i18n="8-bit melody">8-bit 铃声</span><select name="alarmTune"><option value="0" data-i18n="Morning">清晨</option><option value="1" data-i18n="Arcade">街机</option><option value="2" data-i18n="Starlight">星光</option><option value="3" data-i18n="Journey">启程</option></select></label><label><span data-i18n="Snooze / minutes">贪睡 / 分钟</span><input name="snooze" type="number" min="1" max="30" required></label><div class="actions"><button type="button" onclick="alarmAction('test')"><span data-i18n="Test alarm">测试闹钟</span></button><button type="button" onclick="alarmAction('tap')"><span data-i18n="Simulate tap">模拟短按</span></button></div><small><span data-i18n="Tap to snooze; three taps dismiss today">单击贪睡，连续三击停止当天闹钟</span></small><p id="alarmDetails" class="note"></p></div></div></div></div></section><div class="connection-columns"><section><h2>NAS</h2><div class="fields"><label><span data-i18n="NAS background">NAS 底色</span><input name="nasBackground" type="color"><button type="button" class="secondary" onclick="resetColors('nas')" data-i18n="Default NAS color">恢复默认底色</button></label><label><span data-i18n="Address">地址</span><input name="nas" type="text" required></label><label><span data-i18n="Community (blank to keep)">Community（留空保留）</span><input name="community" type="password" autocomplete="off"></label><label><span data-i18n="Port">端口</span><input name="port" type="number" min="1" max="65535"></label><label><span data-i18n="Network interface">网络接口</span><select name="iface"><option value="" data-i18n="Automatic">自动</option></select></label><input type="hidden" name="storage"><label><span data-i18n="Refresh interval / seconds">刷新间隔 / 秒</span><input name="interval" type="number" min="3" max="60"></label></div></section><section><h2><span data-i18n="Connection &amp; access">连接与管理</span></h2><div class="fields"><label><span data-i18n="Wi-Fi name">Wi-Fi 名称</span><input name="ssid" type="text" maxlength="32" required></label><label><span data-i18n="Wi-Fi password (blank to keep)">Wi-Fi 密码（留空保留）</span><input name="pass" type="password" autocomplete="new-password"></label><label><span data-i18n="Admin password (blank to keep)">管理密码（留空保留）</span><input name="admin" type="password" autocomplete="new-password"></label><p id="credentials">{{credentials}}</p></div></section></div></form><section id="tab-photos" class="hidden"><div class="albumHeader"><h2><span data-i18n="Photos">相册 · 裁剪与上传</span></h2><p id="photoCount" class="status"></p></div><p class="note"><span data-i18n="Drag to crop, zoom or rotate.">拖动裁剪，缩放或旋转后上传。</span></p><input id="photoFile" type="file" accept="image/*" hidden><div class="cropLayout"><div class="cropPreview"><canvas id="crop" width="240" height="240" aria-label="照片裁剪预览"></canvas></div><div class="cropControls"><button type="button" id="choosePhoto" class="secondary" onclick="document.getElementById('photoFile').click()"><span data-i18n="Choose photo">选择照片</span></button><label><span data-i18n="Zoom">缩放</span><input id="zoom" type="range" min="1" max="4" step="0.01" value="1"></label><div class="actions"><button type="button" onclick="rotatePhoto()"><span data-i18n="Rotate 90°">旋转 90°</span></button><button type="button" onclick="resetCrop()"><span data-i18n="Reset crop">重置构图</span></button></div><label><span data-i18n="Upload destination">上传到</span><select id="photoSlot"></select></label><button id="uploadPhoto" type="button" onclick="uploadPhoto()" disabled><span data-i18n="Crop &amp; upload">裁剪并上传</span></button><p id="photoMessage" role="status"></p></div></div><div id="album" class="albumGrid"></div></section><section id="tab-maintenance" class="hidden"><h2><span data-i18n="Maintenance">维护</span></h2><div class="maintenance"><small><span data-i18n="Firmware updates keep settings and photos. Factory reset deletes all settings and photos.">更新固件保留配置与照片。恢复出厂设置清除全部配置和照片。</span></small><button type="button" class="danger" onclick="resetSettings()"><span data-i18n="Reset device">重置设备</span></button></div><p class="note"><span data-i18n="Eight taps request reset; three more confirm. Expires after 10 seconds.">连续八击进入重置确认，再连续三击执行；十秒自动取消。</span></p></section></main><script src="/i18n.js?v=1.0.0"></script><script>const config={{config}};</script><script src="/management.js?v=1.0.0"></script></html>

<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOS2-NAS</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#25313b;font:14px system-ui}main{width:calc(100% - 32px);max-width:400px;margin:8vh auto;padding:24px;background:#fff;border:1px solid #dfe5ea;border-radius:12px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:20px;margin:0}h2{font-size:16px;margin:24px 0 18px}label{display:block;margin:16px 0;color:#566573}input,select,button{font:inherit;border:1px solid #d3dce3;border-radius:6px;padding:11px;width:100%;margin-top:7px;background:#fff;color:#25313b}header select{width:auto;margin:0;padding:6px}button{cursor:pointer;background:#157e87;color:white;border-color:#157e87}.networkRow{display:flex;gap:8px;align-items:center}.networkRow select{flex:1;min-width:0}.networkRow button{width:auto;background:#f6f8fa;color:#344653;border-color:#dce3e8}p{line-height:1.6;color:#70808e;font-size:13px}.steps{padding-left:22px;line-height:1.8;color:#566573}.steps li{margin:8px 0}.error{color:#b84b42}.success{padding:16px;background:#edf7f3;border-radius:8px;color:#287b58}.hidden{display:none!important}a{color:#157e87}</style><main data-mode="{{mode}}"><header><h1>MOS2-NAS</h1><select id="accessLanguage" aria-label="Language"><option value="zh">中文</option><option value="en">English</option></select></header><h2 id="title"></h2><form id="accessForm" method="post" action="{{action}}"><input type="hidden" name="token" value="{{token}}"><div id="wifiFields"><label><span data-text="network">Wi-Fi 网络</span><div class="networkRow"><select id="networks"></select><button type="button" id="rescan" data-text="scan">刷新</button></div></label><p id="scanStatus"></p><label><span data-text="ssid">网络名称</span><input id="ssid" name="ssid" value="{{ssid}}" maxlength="32" autocomplete="off"></label></div><label><span data-text="password">密码</span><input name="password" type="password" required maxlength="64" autocomplete="current-password"></label><p id="feedback" class="error" role="status" data-error="{{error}}"></p><button id="submitButton" data-text="submit"></button><input type="hidden" name="language" id="accessLang" value="zh"></form><div id="saved" class="hidden" role="status"><h2 class="success" data-text="saved">网络已保存</h2><p id="savedNetwork"></p><ol class="steps"><li data-text="step1"></li><li data-text="step2"></li><li data-text="step3"></li></ol><p data-text="retry"></p></div><p id="hint"></p></main><script src="/access.js"></script><script src="/setup.js"></script></html>

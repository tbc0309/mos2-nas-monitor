[env:mos2]
platform = espressif8266@4.2.1
board = esp12e
; Supported CPU frequency: speed up rasterization without increasing SNMP polling.
board_build.f_cpu = 160000000L
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld
board_build.flash_mode = dio
monitor_speed = 115200
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  ricmoo/QRCode@0.0.1
  bblanchon/ArduinoJson@6.21.5
  bodmer/TJpg_Decoder@1.1.0
build_flags =
  ; Stream uploads in small blocks; the default 2 KiB allocation can fail
  ; after browser/TCP bursts on a fragmented ESP8266 heap.
  -D HTTP_UPLOAD_BUFLEN=512
  ; Pin the newer bundled NONOS SDK instead of PlatformIO's 2019 default.
  -D PIO_FRAMEWORK_ARDUINO_ESPRESSIF_SDK305
  -D USER_SETUP_LOADED=1
  -D ST7789_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=240
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_DC=0
  -D TFT_RST=2
  -D TFT_CS=-1
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D SPI_FREQUENCY=27000000

name: Firmware checks
on:
  push:
    # 只检查分支推送；版本标签不再重复触发。
    branches: ['**']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.2.0
      - name: Verify generated resources
        run: |
          python tools/embed_locales.py
          python tools/embed_web.py
          python tools/embed_font_hot.py
          git diff --exit-code -- include web
      - run: pio run -e mos2
      - run: pio run -e mos2 -t buildfs
      - run: python tools/build_install_image.py --output dist/MOS2-NAS-1.2.0.bin

